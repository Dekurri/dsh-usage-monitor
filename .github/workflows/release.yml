name: release

# 打 tag（v1.0.0 这种）即自动打包并创建 GitHub Release。
# 手动也可以：git tag v1.0.1 && git push origin v1.0.1
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: pack and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check
        run: |
          node --check index.js
          for f in lib/*.js; do node --check "$f"; done

      - name: Static UI self-check
        run: node tools/ui-selfcheck.mjs

      - name: Pack bundle
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          ls -l dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*.tgz
